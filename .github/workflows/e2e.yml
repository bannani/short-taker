name: E2E (subtitles only)

on:
  push:
    branches: [e2e]

permissions:
  contents: write

jobs:
  subs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VID: BKOfwS1MQCQ
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Install
        run: pip install -q yt-dlp youtube-transcript-api
      - name: yt-dlp subtitles only
        continue-on-error: true
        run: |
          mkdir -p /tmp/res && cd /tmp/res
          yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs "en.*,en" --convert-subs srt \
            -o "%(id)s" "https://www.youtube.com/watch?v=$VID" 2>&1 | tee ytdlp.log
      - name: youtube-transcript-api
        continue-on-error: true
        run: |
          cd /tmp/res
          python - <<'PY' 2>&1 | tee transcript_api.log
          import os
          from youtube_transcript_api import YouTubeTranscriptApi
          vid = os.environ["VID"]
          t = YouTubeTranscriptApi().fetch(vid, languages=["en"])
          def ts(x):
              h, r = divmod(x, 3600); m, s = divmod(r, 60)
              return f"{int(h):02d}:{int(m):02d}:{int(s):02d},{int((s % 1) * 1000):03d}"
          with open(f"{vid}.api.srt", "w") as f:
              for i, s in enumerate(t, 1):
                  f.write(f"{i}\n{ts(s.start)} --> {ts(s.start + s.duration)}\n{s.text}\n\n")
          print("OK", len(t), "lignes")
          PY
      - name: Publish on e2e-results
        if: always()
        run: |
          cd /tmp/res
          git init -q -b e2e-results
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Subtitles attempt ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" e2e-results
