name: E2E (YouTube side)

# Partie YouTube réelle sur un thème : recherche, classement par popularité, choix, téléchargement, transcription.
# Le résultat est publié sur la branche e2e-results pour que l'agent fasse la suite.
on:
  push:
    branches: [e2e]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THEME: "gta6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: denoland/setup-deno@v2   # moteur JS demandé par yt-dlp pour YouTube
        with: { deno-version: v2.x }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: Search — Creative Commons, popularity
        run: python -m short_taker search "$THEME" -n 15 --min-views 1000 2>&1 | tee /tmp/search_cc.log
      - name: Search — any license, popularity (for comparison only, nothing downloaded)
        run: python -m short_taker search "$THEME" -n 15 --license any 2>&1 | tee /tmp/search_any.log
      - name: Run (prepare-only, Creative Commons)
        env:
          WHISPER_MODEL: base
        run: |
          python -m short_taker run "$THEME" --videos 1 --prepare-only --min-video 4 --max-video 40 \
            --min-views 1000 --langs fr,en --max-height 480 -o /tmp/output 2>&1 | tee /tmp/run.log
          for f in /tmp/output/sources/*.mp4; do [ -f "$f" ] || continue
            ffmpeg -v error -y -i "$f" -vf "scale=-2:480" -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 96k /tmp/light.mp4 && mv /tmp/light.mp4 "$f"
          done
      - name: Publish results on branch e2e-results
        if: always()
        run: |
          mkdir -p /tmp/res && cd /tmp/res
          cp /tmp/*.log . 2>/dev/null || true
          [ -d /tmp/output ] && cp -r /tmp/output . || true
          git init -q -b e2e-results
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "E2E results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" e2e-results
