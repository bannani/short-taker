name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill zip
        run: |
          mkdir -p dist
          cd skills && zip -r ../dist/short-taker-skill.zip short-taker

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/short-taker-skill.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "**Claude.ai skill**: download \`short-taker-skill.zip\` below, then Settings → Capabilities → Skills → Upload skill.

          **Claude Code plugin**: \`/plugin marketplace add bannani/short-taker\` then \`/plugin install short-taker@short-taker\`.

          **CLI**: see the [README](https://github.com/bannani/short-taker#3-standalone-cli)."
