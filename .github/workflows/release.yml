name: Release

# Builds short-taker-skill.zip and attaches it to the release.
# Works both when a v* tag is pushed and when a release is published from the GitHub UI.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill zip
        run: |
          mkdir -p dist
          cd skills && zip -r ../dist/short-taker-skill.zip short-taker

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          NOTES="**Claude.ai skill**: download \`short-taker-skill.zip\` below, then Settings → Capabilities → Skills → Upload skill.

          **Claude Code plugin**: \`/plugin marketplace add bannani/short-taker\` then \`/plugin install short-taker@short-taker\`.

          **CLI**: see the [README](https://github.com/bannani/short-taker#3-standalone-cli)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/short-taker-skill.zip --clobber
          else
            gh release create "$TAG" dist/short-taker-skill.zip --title "$TAG" --notes "$NOTES"
          fi
